<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Jugador — RPG Game Master</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h2>Panel Jugador</h2>
            <button type="button" onclick="logout()">Cerrar Sesión</button>
        </div>

        <div class="content">
            <div class="section">
                <h3>Crear Personaje</h3>
                <form id="crearPersonajeForm">
                    <input type="text" id="nombrePersonaje" placeholder="Nombre del personaje" required>
                    <select id="razaSelect" required>
                        <option value="">Selecciona raza</option>
                    </select>
                    <select id="habilidad1Select" required>
                        <option value="">Selecciona habilidad 1</option>
                    </select>
                    <select id="habilidad2Select" required>
                        <option value="">Selecciona habilidad 2</option>
                    </select>
                    <select id="poderSelect" required>
                        <option value="">Selecciona poder</option>
                    </select>
                    <select id="equipamientoSelect" required>
                        <option value="">Selecciona equipamiento</option>
                    </select>
                    <button type="submit">Crear Personaje</button>
                    <p id="crearError" class="error"></p>
                    <p id="crearExito" class="exito"></p>
                </form>
            </div>

            <div class="section">
                <h3>Mis Personajes</h3>
                <div id="personajesList" class="personajes-grid"></div>
            </div>
        </div>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()" title="Cerrar">&times;</span>
            <h3>Editar Personaje</h3>
            <form id="editarPersonajeForm">
                <input type="hidden" id="editPersonajeId">

                <label for="editNombre">Nombre</label>
                <input type="text" id="editNombre" required>

                <label for="editRazaSelect">Raza</label>
                <select id="editRazaSelect" required></select>

                <label for="editHabilidad1Select">Habilidad 1</label>
                <select id="editHabilidad1Select" required></select>

                <label for="editHabilidad2Select">Habilidad 2</label>
                <select id="editHabilidad2Select" required></select>

                <label for="editPoderSelect">Poder</label>
                <select id="editPoderSelect" required></select>

                <label for="editEquipamientoSelect">Equipamiento</label>
                <select id="editEquipamientoSelect" required></select>

                <div id="editError" class="error"></div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        if (localStorage.getItem('rol') !== 'jugador') {
            window.location.href = 'index.html';
        }
        cargarCatalogo();
        cargarPersonajesJugador();
    </script>
</body>
</html>
